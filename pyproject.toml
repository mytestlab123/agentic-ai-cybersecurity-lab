[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-agent-harness-lab"
version = "0.1.0"
description = "A synthetic learning lab for secure agent harness boundaries"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
